<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="login-container">

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
